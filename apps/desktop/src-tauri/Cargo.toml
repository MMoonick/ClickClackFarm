[package]
name = "clickclackfarm-demo"
version = "1.0.4"
description = "Playable Click Clack Farm desktop Demo"
authors = ["Click Clack Farm"]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
clickclackfarm-content-config = { path = "../../../crates/content-config" }
clickclackfarm-domain = { path = "../../../crates/domain" }
num-bigint = "0.4.6"
libc = "0.2.182"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
tauri-plugin-single-instance = "=2.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
core-foundation = "=0.10.1"
core-graphics = { version = "=0.25.0", features = ["catalina"] }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSWorkspace",
  "NSWindow",
  "block2",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSError",
  "NSNotification",
  "NSOperation",
  "NSObject",
  "NSString",
  "block2",
] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
